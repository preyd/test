# /etc/nginx/conf.d/tracker.conf  (или sites-available/ + симлинк в sites-enabled/)
# Файл подключается внутри http {}, поэтому limit_req_zone можно держать здесь.

# Защита Basic Auth от перебора: 10 запросов/мин с одного IP (всплеск до 20)
limit_req_zone $binary_remote_addr zone=tracker_auth:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name tracker.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx < 1.25.1: уберите эту строку и допишите "http2" в listen
    server_name tracker.example.com;

    # SSL уже настроен — оставьте свои пути
    ssl_certificate     /etc/letsencrypt/live/tracker.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tracker.example.com/privkey.pem;

    root  /var/www/tracker;
    index index.html;

    # --- Доступ только по логину/паролю ---
    auth_basic           "Tracker";
    auth_basic_user_file /etc/nginx/.htpasswd-tracker;
    limit_req            zone=tracker_auth burst=20 nodelay;
    limit_req_status     429;

    # --- Заголовки безопасности ---
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header X-Robots-Tag              "noindex, nofollow" always;   # не мешаем SEO-системе
    add_header Content-Security-Policy   "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control             "no-cache" always;            # обновления видны сразу (через 304)

    # --- Сжатие: 15 КБ превращаются в ~5 КБ трафика ---
    gzip on;
    gzip_types application/json application/manifest+json;   # text/html сжимается всегда

    server_tokens off;
    access_log /var/log/nginx/tracker.access.log;
    error_log  /var/log/nginx/tracker.error.log warn;

    # Только чтение
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = / {
        try_files /index.html =404;
    }

    location = /index.html { }

    location = /manifest.json {
        types { application/manifest+json json; }
    }

    # Всё остальное (включая /.htpasswd, .git, случайные пути) — 404
    location / {
        return 404;
    }
}
