<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Трекер">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" id="ati">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230A84FF'/%3E%3Cpath d='M28 52l15 15 30-32' stroke='%23fff' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Трекер</title>
<style>
:root{--bg:#000;--cell:#1c1c1e;--fill:rgba(118,118,128,.24);--sep:rgba(84,84,88,.65);--t:#fff;--t2:rgba(235,235,245,.6);--t3:rgba(235,235,245,.3);--blue:#0a84ff;--red:#ff453a;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;color:var(--t);background:var(--bg);letter-spacing:-.41px;padding:0 env(safe-area-inset-right) calc(32px + env(safe-area-inset-bottom)) env(safe-area-inset-left);-webkit-user-select:none;user-select:none}
header{position:sticky;top:0;z-index:2;padding:env(safe-area-inset-top) 0 0;background:rgba(0,0,0,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
header.s{box-shadow:0 .5px 0 var(--sep)}
h1{font-size:34px;font-weight:700;letter-spacing:.37px;padding:6px 16px 8px}
main{max-width:640px;margin:0 auto}
h2{font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:-.08px;color:var(--t2);padding:22px 32px 7px}
.g{background:var(--cell);border-radius:10px;margin:0 16px;overflow:hidden}
.r{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:6px 16px}
.r+.r:before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.r>span{flex:none}
.v{color:var(--t2);text-align:right}
.col{flex-direction:column;align-items:stretch;gap:2px;padding:10px 16px}
.k{font-size:13px;color:var(--t2)}
.x{white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
.f{font-size:13px;color:var(--t2);padding:7px 32px 0}
input,textarea,button{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;outline:0;-webkit-appearance:none;appearance:none}
input[type=date]{color:var(--blue);background:var(--fill);border-radius:7px;padding:5px 10px;min-height:34px;text-align:center}
input[type=date]::-webkit-date-and-time-value{text-align:center}
input[type=number]{width:70px;text-align:right;color:var(--t2);-moz-appearance:textfield}
input::-webkit-inner-spin-button{display:none}
textarea{width:100%;resize:none;min-height:24px;padding:4px 0;line-height:1.3;-webkit-user-select:text;user-select:text}
::placeholder{color:var(--t3)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:4px 0;width:100%}
.seg button{flex:1;height:28px;font-size:13px;font-weight:500;border-radius:7px;transition:background .2s}
.seg button[aria-pressed=true]{background:#636366;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.st{display:flex;align-items:center;gap:10px}
.sp{display:flex;background:var(--fill);border-radius:8px;height:32px}
.sp button{width:47px;font-size:22px;font-weight:300;line-height:1}
.sp button+button{border-left:.5px solid var(--sep)}
.sp button:active,.btn:active,.lnk:active{opacity:.5}
.btn{display:block;width:calc(100% - 32px);margin:16px;height:50px;border-radius:12px;background:var(--blue);font-weight:600;color:#fff}
.lnk{width:100%;justify-content:center;color:var(--blue)}
.del{color:var(--red)}
.e{text-align:center;color:var(--t2);padding:28px 32px}
.e b{display:block;font-size:44px;margin-bottom:8px;font-weight:400}
</style>
</head>
<body>
<header id="hd"><h1>Трекер</h1></header>
<main>
<form id="fm" autocomplete="off">
<h2>Новая запись</h2>
<div class="g">
<label class="r"><span>Дата</span><input type="date" id="d" required></label>
<div class="r col"><span class="k">Пары в вузе</span><div class="seg" id="p" role="group"></div></div>
<div class="r"><span>Работа за ПК, ч</span><div class="st"><input type="number" id="h" inputmode="decimal" min="0" max="24" step="0.5" value="0" aria-label="Часы"><div class="sp"><button type="button" data-s="-0.5" aria-label="Меньше">−</button><button type="button" data-s="0.5" aria-label="Больше">+</button></div></div></div>
</div>
<h2>День</h2>
<div class="g">
<div class="r col"><span class="k">План на день</span><textarea id="pl" rows="1" placeholder="Что планирую сделать"></textarea></div>
<div class="r col"><span class="k">Факт выполнения</span><textarea id="fa" rows="1" placeholder="Что получилось"></textarea></div>
<div class="r col"><span class="k">Заметки</span><textarea id="no" rows="1" placeholder="Мысли, выводы"></textarea></div>
</div>
<button class="btn">Добавить запись</button>
</form>
<h2 id="lh">Записи</h2>
<div id="ls"></div>
<h2>Данные</h2>
<div class="g">
<button type="button" class="r lnk" id="ex">Экспорт в JSON</button>
<label class="r lnk">Импорт из JSON<input type="file" id="im" accept="application/json,.json" hidden></label>
</div>
<p class="f">Данные хранятся только на этом устройстве.</p>
</main>
<script>
(()=>{
const K='pt.v1',$=i=>document.getElementById(i),
el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e},
today=()=>{const n=new Date;return new Date(n-n.getTimezoneOffset()*6e4).toISOString().slice(0,10)},
fmt=new Intl.DateTimeFormat('ru',{weekday:'short',day:'numeric',month:'long',year:'numeric'});
let db=[],pairs=0;
try{db=JSON.parse(localStorage.getItem(K))||[]}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Не удалось сохранить: хранилище недоступно')}};

/* Сегментированный контрол 0–6 */
const seg=$('p');
for(let i=0;i<7;i++){const b=el('button',0,i);b.type='button';b.dataset.v=i;seg.append(b)}
const setP=v=>{pairs=v;for(const b of seg.children)b.setAttribute('aria-pressed',b.dataset.v==v)};
seg.onclick=e=>{const v=e.target.dataset.v;if(v!=null)setP(+v)};

/* Степпер часов */
const h=$('h'),clamp=v=>Math.min(24,Math.max(0,Math.round((+v||0)*2)/2));
document.querySelector('.sp').onclick=e=>{const s=e.target.dataset.s;if(s)h.value=clamp(+h.value+ +s)};
h.onchange=()=>h.value=clamp(h.value);

/* Автовысота textarea */
const grow=t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'};
document.querySelectorAll('textarea').forEach(t=>t.oninput=()=>grow(t));

const reset=()=>{$('fm').reset();$('d').value=today();h.value=0;setP(0);document.querySelectorAll('textarea').forEach(grow)};

const row=(k,v)=>{const r=el('div','r');r.append(el('span',0,k),el('span','v',v));return r},
txt=(k,v)=>{const r=el('div','r col');r.append(el('span','k',k),el('div','x',v));return r};

function render(){
  db.sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
  const ls=$('ls');ls.textContent='';
  $('lh').textContent='Записи'+(db.length?' · '+db.length:'');
  if(!db.length){const e=el('div','g e');e.append(el('b',0,'🗒️'),'Пока нет записей');ls.append(e);return}
  const f=document.createDocumentFragment();
  for(const x of db){
    const dt=new Date(x.d+'T12:00');
    f.append(el('h2',0,isNaN(dt)?x.d:fmt.format(dt)));
    const g=el('div','g');
    g.append(row('🎓 Пары',x.p),row('💻 За ПК',x.h.toLocaleString('ru')+' ч'));
    if(x.plan)g.append(txt('План',x.plan));
    if(x.fact)g.append(txt('Факт',x.fact));
    if(x.note)g.append(txt('Заметки',x.note));
    const d=el('button','r lnk del','Удалить запись');d.type='button';d.dataset.id=x.id;g.append(d);
    f.append(g);
  }
  ls.append(f);
}

$('ls').onclick=e=>{
  const id=e.target.dataset.id;
  if(id&&confirm('Удалить эту запись? Действие нельзя отменить.')){db=db.filter(x=>x.id!=id);save();render()}
};

$('fm').onsubmit=e=>{
  e.preventDefault();
  const v=i=>$(i).value.trim();
  db.push({id:Date.now(),d:$('d').value||today(),p:pairs,h:clamp(h.value),plan:v('pl'),fact:v('fa'),note:v('no')});
  save();reset();render();
  $('lh').scrollIntoView({behavior:'smooth'});
};

$('ex').onclick=()=>{
  const a=el('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));
  a.download='tracker-'+today()+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1e4);
};
$('im').onchange=async e=>{
  const fl=e.target.files[0];if(!fl)return;
  try{
    const arr=JSON.parse(await fl.text());if(!Array.isArray(arr))throw 0;
    const ids=new Set(db.map(x=>x.id));let n=0;
    for(const x of arr)if(x&&x.id&&/^\d{4}-\d\d-\d\d$/.test(x.d)&&!ids.has(x.id)){
      db.push({id:+x.id,d:x.d,p:Math.min(6,Math.max(0,x.p|0)),h:clamp(x.h),plan:String(x.plan||''),fact:String(x.fact||''),note:String(x.note||'')});n++}
    save();render();alert('Импортировано записей: '+n);
  }catch(_){alert('Файл не распознан')}
  e.target.value='';
};

/* Тень шапки при прокрутке */
addEventListener('scroll',()=>$('hd').classList.toggle('s',scrollY>4),{passive:true});

/* Иконка для «Домой»: iOS не принимает SVG, рисуем PNG 180×180 на canvas */
try{
  const c=el('canvas');c.width=c.height=180;const x=c.getContext('2d'),gr=x.createLinearGradient(0,0,0,180);
  gr.addColorStop(0,'#3a9bff');gr.addColorStop(1,'#0060df');x.fillStyle=gr;x.fillRect(0,0,180,180);
  x.strokeStyle='#fff';x.lineWidth=18;x.lineCap=x.lineJoin='round';
  x.beginPath();x.moveTo(50,94);x.lineTo(77,121);x.lineTo(131,63);x.stroke();
  $('ati').href=c.toDataURL();
}catch(e){}

reset();render();
})();
</script>
</body>
</html>
